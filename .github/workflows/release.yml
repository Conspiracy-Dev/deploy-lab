name: select production release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character commit SHA reachable from main
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  release:
    uses: ./.github/workflows/production-release.yml
    with:
      release_source: manual
      revision: ${{ inputs.revision }}

  deploy:
    needs: release
    if: needs.release.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-release
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
      DEPLOY_USER: ${{ vars.PRODUCTION_SSH_USER }}
      IMAGE_REF: ${{ needs.release.outputs.image_ref }}
    steps:
      - name: Configure approved SSH transport
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"

          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy the selected immutable digest
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_ed25519" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/deploy-lab $IMAGE_REF"
