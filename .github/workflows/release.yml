name: select production release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character commit SHA reachable from main
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  select-image:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      IMAGE_NAME: ghcr.io/conspiracy-dev/deploy-lab
      DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
      DEPLOY_USER: ${{ vars.PRODUCTION_SSH_USER }}
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify the selected revision belongs to main
        run: |
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'revision must be a full 40-character lowercase SHA' >&2
            exit 1
          fi

          git merge-base --is-ancestor "$REVISION" origin/main
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GHCR for digest resolution
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Resolve immutable GHCR digest
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$REVISION" --format "{{.Manifest.Digest}}")"
          test -n "$digest"
          printf "image=%s@%s\n" "$IMAGE_NAME" "$digest" >> "$GITHUB_OUTPUT"
          {
            printf "%s\n\n" "### Selected production image"
            printf "\`%s@%s\`\n" "$IMAGE_NAME" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Configure SSH transport
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"

          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy the selected digest
        env:
          IMAGE_REF: ${{ steps.image.outputs.image }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_ed25519" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/deploy-lab $IMAGE_REF"
