name: select production release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character commit SHA reachable from main
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  select-image:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      IMAGE_NAME: ghcr.io/ishavlovsky/deploy-lab
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify the selected revision belongs to main
        run: |
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'revision must be a full 40-character lowercase SHA' >&2
            exit 1
          fi

          git merge-base --is-ancestor "$REVISION" origin/main
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: image
        name: Resolve immutable GHCR digest
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$REVISION" --format "{{.Manifest.Digest}}")"
          test -n "$digest"
          printf "image=%s@%s\n" "$IMAGE_NAME" "$digest" >> "$GITHUB_OUTPUT"
          {
            printf "%s\n\n" "### Selected production image"
            printf "\`%s@%s\`\n" "$IMAGE_NAME" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
