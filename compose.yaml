services:
  api:
    image: deploy-lab-static:local
    command: ['node', '/app/.output/server/index.mjs']
    user: node
    environment:
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?Set NUXT_PUBLIC_SITE_URL for this build}
      NUXT_NOTION_TOKEN: ${NUXT_NOTION_TOKEN:-}
      NUXT_NOTION_DATA_SOURCE_ID: ${NUXT_NOTION_DATA_SOURCE_ID:-}
      NUXT_TRUST_PROXY: 'true'
      NITRO_HOST: '0.0.0.0'
      NITRO_PORT: '3000'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/contact-health']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
  site:
    build:
      context: .
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?Set NUXT_PUBLIC_SITE_URL for this build}
    image: deploy-lab-static:local
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
